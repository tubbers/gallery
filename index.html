<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wade Tubman — Astrophotography</title>
<meta name="description" content="Deep-sky astrophotography from Sydney and the dark skies of New South Wales.">
<meta property="og:title" content="Wade Tubman — Astrophotography">
<meta property="og:description" content="Deep-sky astrophotography from Sydney and the dark skies of New South Wales.">
<meta property="og:type" content="website">
<link rel="icon" href="logo-light-on-dark.png">
<style>
/* ============================================================
   PALETTE
   dark  = skydome's ember-on-black
   light = the processing tracker's parchment + amber
   ============================================================ */
:root{
  --bg:#060201; --panel:#0f0402; --panel2:#150603; --edge:#43170f;
  --ink:#ffb694; --dim:#a8543c; --hot:#ffcf6b; --pick:#7fffd4;
  --shadow:rgba(0,0,0,.7);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  --logo:url("logo-light-on-dark.png");
}
html[data-theme="light"]{
  --bg:#ede5d2; --panel:#f8f4ea; --panel2:#f2ebdc; --edge:#d3c2a4;
  --ink:#2b2119; --dim:#7a6a56; --hot:#b45309; --pick:#0f766e;
  --shadow:rgba(60,45,25,.22);
  --logo:url("logo-dark-on-light.png");
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pick); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- masthead ---------- */
header{
  position:relative; height:min(52vh,470px); min-height:290px;
  display:grid; place-items:center; overflow:hidden;
  background:#000; border-bottom:1px solid var(--edge);
}
#heroimg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:50% 50%;
  opacity:0; transition:opacity 1.1s ease;
}
#heroimg.in{opacity:1}
#scrim{
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,.62),rgba(0,0,0,.30) 46%,rgba(0,0,0,.74));
}
#herotext{position:relative; text-align:center; padding:0 24px}
#logo{
  width:min(360px,66vw); height:calc(min(360px,66vw) * 0.349);
  margin:0 auto;
  background:url("logo-light-on-dark.png") center/contain no-repeat;
}
#tagline{
  margin:14px auto 0; max-width:50ch;
  color:rgba(255,255,255,.80); font-size:14.5px;
  text-shadow:0 1px 12px rgba(0,0,0,.9);
}
#tally{
  margin-top:9px; font-family:var(--mono); font-size:11.5px;
  letter-spacing:.05em; color:rgba(255,255,255,.60);
}
#tally b{color:#ffcf6b; font-weight:600}
#herocap{
  position:absolute; right:13px; bottom:10px; z-index:2;
  font-family:var(--mono); font-size:10px; letter-spacing:.05em;
  color:rgba(255,255,255,.5); text-decoration:none;
}
#herocap:hover{color:#ffcf6b}
@media (max-width:640px){ header{height:38vh; min-height:230px} }

/* ---------- controls ---------- */
#bar{
  position:sticky; top:0; z-index:40;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  padding:11px 20px; background:var(--panel);
  border-bottom:1px solid var(--edge);
}
#chips{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 auto}
.chip{
  padding:6px 13px; border:1px solid var(--edge); border-radius:999px;
  font-size:13px; background:var(--bg); white-space:nowrap;
}
.chip:hover{border-color:var(--hot)}
.chip.on{background:var(--hot); border-color:var(--hot); color:var(--bg); font-weight:600}
.chip .n{opacity:.55; font-size:11px; margin-left:5px}
#seek{padding:7px 11px; border:1px solid var(--edge); border-radius:3px; background:var(--bg); font-size:14px}
#seek:hover{border-color:var(--hot); color:var(--hot)}
#q{
  display:none; width:100%; order:9; padding:8px 12px;
  background:var(--bg); color:var(--ink);
  border:1px solid var(--edge); border-radius:3px; font-size:14px;
}
#q.open{display:block}
#q::placeholder{color:var(--dim)}
#dir{
  padding:8px 11px; border:1px solid var(--edge); border-radius:3px;
  background:var(--bg); font-size:14px; min-width:36px;
}
#dir:hover{border-color:var(--hot); color:var(--hot)}
#sort{
  padding:8px 10px; background:var(--bg); color:var(--ink);
  border:1px solid var(--edge); border-radius:3px; font-size:14px;
}
#theme{
  padding:8px 13px; border:1px solid var(--edge); border-radius:3px;
  font-size:13px; letter-spacing:.03em; background:var(--bg);
}
#theme:hover{border-color:var(--hot); color:var(--hot)}

/* ---------- justified grid ---------- */
main{padding:20px}
#grid{display:flex; flex-wrap:wrap; gap:9px; max-width:2000px; margin:0 auto}
#grid::after{content:""; flex-grow:1e6}   /* keeps the last row left-aligned */
figure{
  position:relative; margin:0; height:250px;
  overflow:hidden; background:var(--panel2); cursor:pointer;
  border-radius:2px;
}
figure img{
  display:block; width:100%; height:100%; object-fit:cover;
  transition:transform .35s ease, filter .35s ease;
}
figure:hover img,figure:focus-within img{transform:scale(1.035); filter:brightness(1.08)}
figcaption{
  position:absolute; inset:auto 0 0 0; padding:26px 12px 9px;
  background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.45) 55%,transparent);
  color:#fff; pointer-events:none;
}
.cap-name{font-size:14px; font-weight:600; line-height:1.25}
.cap-meta{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
  color:rgba(255,255,255,.72); margin-top:3px;
  display:flex; gap:9px; align-items:center;
}
.cap-meta .likes{color:#ffcf6b}
#reach{display:flex; gap:20px; margin-top:20px; flex-wrap:wrap}
#reach:empty{display:none}
.stat{
  display:flex; align-items:baseline; gap:6px;
  font-family:var(--mono); font-size:15px; color:var(--hot);
  text-decoration:none; cursor:default;
}
a.stat{cursor:pointer}
a.stat:hover{color:var(--pick)}
.stat .ic{font-size:14px; line-height:1}
.stat .lb{font-family:var(--sans); font-size:11.5px; color:var(--dim)}
@media (max-width:760px){ figure{height:180px} main{padding:12px} }

/* ---------- lightbox ---------- */
#lb{
  position:fixed; inset:0; z-index:100; display:none;
  background:var(--bg);
}
#lb.on{display:grid; grid-template-columns:1fr 372px; grid-template-rows:minmax(0,1fr)}
#lb.solo{grid-template-columns:1fr}
#lb.solo #info{display:none}
#lb.solo #next{right:14px}
#stage{
  position:relative; display:block; overflow:hidden;
  padding:22px; min-width:0; min-height:0; background:#000;
  touch-action:none;
}
#viewport{
  position:absolute; inset:22px; overflow:hidden;
  display:grid; place-items:center; cursor:zoom-in;
}
#viewport{cursor:zoom-in}
#lb.solo #viewport{cursor:zoom-out}
#viewport.zoomed{cursor:grab}
#viewport.dragging{cursor:grabbing}
#pan{
  position:absolute; inset:0;
  transform-origin:0 0; will-change:transform;
  transition:transform .22s cubic-bezier(.22,.7,.3,1);
}
#pan.live{transition:none}
#zoomhint{
  position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
  z-index:3; font-family:var(--mono); font-size:10px; letter-spacing:.05em;
  color:rgba(255,255,255,.34); pointer-events:none;
  transition:opacity .3s;
}
#tools{
  position:absolute; right:14px; top:14px; z-index:5;
  display:flex; gap:8px;
}
#tools button, #tools a{
  width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center; font-size:16px;
  background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.16);
}
#tools a{text-decoration:none}
#tools button:hover, #tools a:hover{background:var(--hot); color:#000; border-color:var(--hot)}
#tools button.on{background:var(--hot); color:#000; border-color:var(--hot)}
html[data-theme="light"] #stage{background:#111}
#stage #lbimg{
  display:block; width:100%; height:100%;
  object-fit:contain; object-position:center;
  -webkit-user-drag:none; user-select:none; -webkit-user-select:none;
}
#stage #moonlayer{
  position:absolute; left:50%; top:50%; translate:-50% -50%;
  pointer-events:none; opacity:.9; display:none;
  max-width:none; max-height:none; height:auto;
  filter:drop-shadow(0 0 20px rgba(0,0,0,.95));
}
#stage #moonlayer.on{display:block}

#info{
  padding:26px 26px 60px; overflow-y:auto;
  background:var(--panel); border-left:1px solid var(--edge);
}
#info h2{margin:0; font-size:24px; line-height:1.2; font-weight:600}
#codes{
  font-family:var(--mono); font-size:12px; color:var(--dim);
  margin-top:6px; letter-spacing:.04em;
}
#blurb{margin:20px 0 0; font-size:14.5px; line-height:1.68; max-width:46ch}
#blurb.placeholder{color:var(--dim); font-style:italic}

dl{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; margin:24px 0 0; font-size:13px}
dt{color:var(--dim)}
dd{margin:0; font-family:var(--mono); font-size:12.5px}

#acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:26px}
#acts a,#acts button{
  padding:8px 13px; border:1px solid var(--edge); border-radius:3px;
  font-size:13px; text-decoration:none; background:var(--bg);
}
#acts a:hover,#acts button:hover{border-color:var(--hot); color:var(--hot)}
#acts .ext{opacity:.5; font-size:11px; margin-left:5px}
#grab{position:relative}
#grabmenu{
  position:absolute; left:0; top:calc(100% + 6px); z-index:20; min-width:250px;
  background:var(--panel2); border:1px solid var(--edge); border-radius:4px;
  box-shadow:0 12px 34px var(--shadow); overflow:hidden; display:none;
}
#grabmenu.on{display:block}
#grabmenu a{
  display:block; padding:11px 14px; text-decoration:none; font-size:13px;
  border-bottom:1px solid var(--edge);
}
#grabmenu a:last-child{border-bottom:0}
#grabmenu a:hover{background:var(--bg); color:var(--hot)}
#grabmenu .sub{display:block; font-size:11.5px; color:var(--dim); margin-top:2px}

#close,#prev,#next{
  position:fixed; z-index:110; width:44px; height:44px;
  display:grid; place-items:center; font-size:22px; line-height:1;
  background:rgba(0,0,0,.55); color:#fff; border-radius:50%;
}
#close{top:14px; left:14px}
#prev{top:50%; left:14px; transform:translateY(-50%)}
#next{top:50%; left:auto; right:calc(372px + 14px); transform:translateY(-50%)}
#close:hover,#prev:hover,#next:hover{background:var(--hot); color:#000}

@media (max-width:900px){
  #lb.on{grid-template-columns:1fr; grid-template-rows:52vh minmax(0,1fr)}
  #lb.solo{grid-template-rows:minmax(0,1fr)}
  #lb.solo #stage{padding:0}
  #lb.solo #viewport{inset:0}
  #info{border-left:0; border-top:1px solid var(--edge); padding:20px 20px 50px}
  #next{right:14px}
  #prev,#next{top:26vh}
}

footer{
  padding:44px 24px 60px; text-align:center;
  border-top:1px solid var(--edge); color:var(--dim); font-size:13px;
}
footer a{color:var(--hot); text-decoration:none}
footer a:hover{text-decoration:underline}
#status{padding:60px 24px; text-align:center; color:var(--dim); font-family:var(--mono); font-size:13px}
</style>
</head>
<body>

<header>
  <img id="heroimg" alt="" aria-hidden="true">
  <div id="scrim"></div>
  <div id="herotext">
    <div id="logo" role="img" aria-label="Wade Tubman Astrophotography"></div>
    <p id="tagline">Deep-sky imaging from a Bortle&nbsp;7 backyard in Sydney, and from the dark skies of New South Wales.</p>
    <p id="tally"></p>
  </div>
  <a id="herocap" href="#"></a>
</header>

<div id="bar">
  <div id="chips"></div>
  <button id="seek" type="button" aria-label="Search" title="Search">⌕</button>
  <select id="sort" aria-label="Sort by">
    <option value="ra">Sky position</option>
    <option value="name">Name</option>
    <option value="distance">Distance</option>
    <option value="fov">Field of view</option>
    <option value="hours">Exposure</option>
    <option value="likes">Popularity</option>
  </select>
  <button id="dir" type="button" aria-label="Reverse sort order">↑</button>
  <button id="theme" type="button">Light</button>
  <input id="q" type="search" placeholder="Search by name, catalogue or constellation" aria-label="Search images">
</div>

<main><div id="grid"></div></main>
<p id="status">Loading the catalogue…</p>

<footer>
  <p>Images © Wade Tubman. All rights reserved.</p>
  <p style="font-family:var(--mono);font-size:11px;opacity:.6;margin-top:26px">
    v0.9 · built with Claude
  </p>
  <p style="color:var(--dim);margin-bottom:6px">Also find my work at</p>
  <p>
    <a href="https://tubbers.github.io/skydome/" target="_blank" rel="noopener">Sky dome</a> ·
    <a href="https://app.astrobin.com/u/tubbers" target="_blank" rel="noopener">AstroBin</a> ·
    <a href="https://telescopius.com/profile/tubbers" target="_blank" rel="noopener">Telescopius</a> ·
    <a href="https://astrophotomarket.com/en/author/wade-tubman" target="_blank" rel="noopener">AstrophotoMarket</a>
  </p>
</footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Image detail">
  <div id="stage">
    <div id="viewport">
      <div id="pan"><img id="lbimg" alt="" draggable="false"></div>
      <img id="moonlayer" src="moon.png" alt="The full Moon at the same scale">
    </div>
    <div id="tools">
      <button id="tfull" type="button" title="Full screen" aria-label="Full screen">&#9974;</button>
      <button id="tmoon" type="button" title="Compare with the Moon" aria-label="Compare with the Moon">&#9790;</button>
      <a id="tdome" href="#" target="_blank" rel="noopener" title="See where it is in the sky" aria-label="See where it is in the sky">&#9673;</a>
    </div>
    <p id="zoomhint">scroll to zoom</p>
  </div>
  <div id="info">
    <h2 id="lbname"></h2>
    <p id="codes"></p>
    <p id="blurb"></p>
    <div id="reach"></div>
    <dl id="facts"></dl>
    <div id="acts"></div>
  </div>
  <button id="close" type="button" aria-label="Close">✕</button>
  <button id="prev" type="button" aria-label="Previous image">‹</button>
  <button id="next" type="button" aria-label="Next image">›</button>
</div>

<script>
/* ==========================================================================
   CONFIG — the only bits you'd ever need to change
   ========================================================================== */
const SKYDOME   = "https://tubbers.github.io/skydome/";  // where the images live
const MOON_DEG  = 0.518;                                  // Moon's apparent diameter

/* ==========================================================================
   DATA LOADING
   Three files, only the first is required:
     1. skydome/manifest.json  — images + plate solve + distance   (remote)
     2. targets.json           — your planning list, for constellation + type
     3. gallery.json           — per-image blurbs, gear, hours     (optional)
   ========================================================================== */
let IMAGES = [], VIEW = [], CUR = -1;

const url = p => SKYDOME + p.split("/").map(encodeURIComponent).join("/");
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const num  = s => { const n = parseFloat(String(s ?? "").replace(/,/g,"")); return isFinite(n) ? n : null; };

// Presentation only — gallery.json keeps the raw values.
const OPTICS = {
  "200PDS":       "200PDS Newtonian \u2014 950mm",
  "ASKAR 91F":    "Askar 91F \u2014 610mm",
  "RedCat 61":    "RedCat 61 \u2014 300mm",
  "RedCat 51":    "RedCat 51 \u2014 250mm",
  "Pentax 135mm": "Pentax 135mm \u2014 135mm",
  "Seestar S50":  "Seestar S50 \u2014 250mm"
};
const showScope  = s => s ? (OPTICS[s] || s) : null;
const showCamera = c => c ? (/1600MM|2600MM/.test(c) ? c + " (mono)" : c) : null;
const showFilter = f => !f ? null
  : /^(osc )?broadband$/i.test(f.trim()) ? "None" : f;

// Roll the catalogue's granular types up into something a visitor can use.
const BUCKETS = {
  "Nebulae":     ["Emission Nebula","HII Region"],
  "Galaxies":    ["Spiral Galaxy","Peculiar Galaxy","Galaxy","Group of Galaxies"],
  "Dust & dark": ["Reflection Nebula","Dark Nebula","Dense Core","Star Forming Region"],
  "Remnants":    ["Supernova Remnant","Planetary Nebula"]
};
function bucket(t){
  if(!t) return null;
  for(const [name,list] of Object.entries(BUCKETS)) if(list.includes(t)) return name;
  return null;
}

// angular separation between two sky positions, in degrees
function sep(ra1,de1,ra2,de2){
  const R = Math.PI/180;
  const v = Math.sin(de1*R)*Math.sin(de2*R)
          + Math.cos(de1*R)*Math.cos(de2*R)*Math.cos((ra1-ra2)*R);
  return Math.acos(Math.max(-1,Math.min(1,v)))/R;
}

async function grab(u){
  try{ const r = await fetch(u,{cache:"no-store"}); return r.ok ? await r.json() : null; }
  catch(e){ return null; }
}

async function boot(){
  const [man,targets,extra] = await Promise.all([
    grab(SKYDOME+"manifest.json"),
    grab("targets.json"),
    grab("gallery.json")
  ]);

  if(!man || !man.images){
    document.getElementById("status").textContent =
      "Couldn't reach the skydome catalogue. Check that " + SKYDOME + "manifest.json is published.";
    return;
  }

  const byLabel = {};
  (Array.isArray(extra) ? extra : (extra && extra.images) || []).forEach(e => { if(e.label) byLabel[e.label] = e; });

  // Unsolved entries are normally dome-only rejects, but the solar-system
  // ones are explicitly flagged for the gallery — let those through.
  IMAGES = man.images.filter(i => i.solved !== false || i.kind === "solar-system").map(im => {
    const ov = byLabel[im.label] || {};

    // match against the planning list by sky position — no name-wrangling needed
    let cat = null;
    if(Array.isArray(targets)){
      let best = null;
      for(const t of targets){
        if(t.ra == null || t.dec == null) continue;
        const d = sep(im.ra_deg, im.dec_deg, t.ra, t.dec);
        if(!best || d < best.d) best = {d, t};
      }
      const tol = Math.max(im.fov_w_deg, im.fov_h_deg) * 0.75;
      if(best && best.d <= tol) cat = best.t;
    }

    return {
      ...im,
      slug:      im.slug || slug(im.label),
      thumbUrl:  url(im.thumb),
      fullUrl:   url(im.file),
      ratio:     (im.width_px && im.height_px) ? im.width_px/im.height_px : 1.5,
      hasSky:    im.ra_deg != null && im.fov_w_deg > 0,
      // overrides win, then the coordinate match, then nothing
      // Facts come from the manifest — skydome is the single source of truth.
      // gallery.json only carries editorial prose and things the manifest can't know.
      constellation: im.constellation ?? cat?.constellation ?? null,
      objectType:    ov.type          ?? cat?.type          ?? null,
      catCode:       ov.code          ?? cat?.name          ?? null,
      distLy:        im.distance_ly   ?? null,
      distNote:      im.distance_note ?? null,
      foundBy:       im.discovered_by ?? null,
      blurb:         ov.blurb         ?? im.description     ?? null,
      scope:         ov.scope         ?? null,
      camera:        ov.camera        ?? null,
      filters:       ov.filters       ?? null,
      location:      ov.location      ?? null,
      bortle:        ov.bortle        ?? null,
      hours:         ov.hours         ?? null,
      nights:        ov.nights        ?? null,
      captured:      ov.captured      ?? null,
      astrobin:      ov.astrobin      ?? null,
      telescopius:   ov.telescopius   ?? null,
      fits:          ov.amp_id && ov.amp_slug
                       ? `https://astrophotomarket.com/en/image-details/${ov.amp_id}/${ov.amp_slug}`
                       : (ov.fits ?? null),
      showcase:      ov.amp_id
                       ? `https://astrophotomarket.com/en/showcase-gallery?dataset=${ov.amp_id}`
                       : null,
      wallpaper:     ov.wallpaper     ?? null,
      downloads:     ov.downloads      ?? 0,
      favourites:    (ov.favourites ?? 0) + (ov.astrobin_likes ?? 0) + (ov.telescopius_likes ?? 0),
      reprocessed:   ov.reprocessed    ?? 0,
      featured:      ov.featured === true,
      group:         bucket(ov.type ?? cat?.type ?? null)
    };
  });

  document.getElementById("status").remove();

  const withHrs = IMAGES.filter(i => i.hours);
  const total   = withHrs.reduce((a,i) => a + i.hours, 0);
  document.getElementById("tally").innerHTML =
    `<b>${IMAGES.length}</b> images` + (total ? ` · <b>${Math.round(total)}</b> hours of exposure` : "");

  hero();
  chips();
  render();
  openFromHash();
}

/* Pick the banner: anything flagged `featured` in gallery.json, else the
   widest field on the list, which reads best cropped to a letterbox. */
function hero(){
  const picks = IMAGES.filter(i => i.featured);
  // A banner is a wide letterbox, so a portrait frame loses most of itself to
  // the crop. Prefer landscape, then widest field.
  const pool = picks.length ? picks : IMAGES.filter(i => i.ratio >= 1.3 && i.hasSky);
  const im = pool.length
    ? [...pool].sort((a,b) => (b.fov_w_deg*b.fov_h_deg)-(a.fov_w_deg*a.fov_h_deg))[0]
    : IMAGES[0];
  if(!im) return;
  const el = document.getElementById("heroimg");
  el.src = im.fullUrl;
  el.onload = () => el.classList.add("in");
  const cap = document.getElementById("herocap");
  cap.textContent = im.label;
  cap.href = "#" + im.slug;
  cap.onclick = e => { e.preventDefault(); const ix = VIEW.findIndex(v => v.slug === im.slug); if(ix >= 0) open(ix); };
}

function chips(){
  const counts = {};
  IMAGES.forEach(i => { if(i.group) counts[i.group] = (counts[i.group]||0)+1; });
  const box = document.getElementById("chips");
  box.innerHTML = "";
  Object.keys(BUCKETS).filter(n => counts[n]).forEach(name => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed","false");
    b.innerHTML = `${name}<span class="n">${counts[name]}</span>`;
    b.onclick = () => {
      PICKED.has(name) ? PICKED.delete(name) : PICKED.add(name);
      b.classList.toggle("on", PICKED.has(name));
      b.setAttribute("aria-pressed", PICKED.has(name));
      render();
    };
    box.appendChild(b);
  });
}

/* ==========================================================================
   GRID
   ========================================================================== */
let PICKED = new Set(), ASC = true;

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const s = document.getElementById("sort").value;

  VIEW = IMAGES.filter(i =>
    (!PICKED.size || PICKED.has(i.group)) &&
    (!q || [i.label,i.catCode,i.constellation,i.objectType]
      .filter(Boolean).join(" ").toLowerCase().includes(q)));

  const D = i => num(i.distLy) ?? Infinity;
  const key = {
    ra:       i => i.hasSky ? i.ra_deg : 1e6,
    distance: i => D(i),
    fov:      i => i.fov_w_deg * i.fov_h_deg,
    hours:    i => i.hours || 0,
    likes:    i => i.favourites + i.downloads
  }[s];

  VIEW.sort((a,b) => s === "name"
    ? a.label.localeCompare(b.label)
    : key(a) - key(b));
  if(!ASC) VIEW.reverse();

  const g = document.getElementById("grid");
  g.innerHTML = "";
  VIEW.forEach((im,ix) => {
    const f = document.createElement("figure");
    f.style.flex = `${im.ratio} 1 ${im.ratio*250}px`;
    f.tabIndex = 0;
    f.setAttribute("role","button");
    f.setAttribute("aria-label",`Open ${im.label}`);

    const img = document.createElement("img");
    img.src = im.thumbUrl; img.alt = im.label; img.loading = "lazy"; img.decoding = "async";

    const cap  = document.createElement("figcaption");
    const nm   = document.createElement("div"); nm.className = "cap-name"; nm.textContent = im.label;
    const meta = document.createElement("div"); meta.className = "cap-meta";
    const shortCon = im.constellation ? im.constellation.split(" (")[0] : null;
    const bits = [shortCon, im.distLy ? im.distLy + " ly" : null].filter(Boolean).join("  ·  ");
    meta.append(document.createTextNode(bits));
    const score = im.favourites + im.downloads;
    if(score){
      const k = document.createElement("span");
      k.className = "likes"; k.textContent = "\u2665 " + score;
      meta.appendChild(k);
    }
    cap.append(nm, meta);

    f.append(img, cap);
    f.onclick   = () => open(ix);
    f.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(ix); } };
    g.appendChild(f);
  });

  if(!VIEW.length) g.innerHTML = '<p style="color:var(--dim);padding:40px">Nothing matches that search.</p>';
}

/* ==========================================================================
   LIGHTBOX
   ========================================================================== */
const lb = document.getElementById("lb");
let moonOn = false;

function open(ix){
  CUR = ix;
  const im = VIEW[ix];

  document.getElementById("lbimg").src = im.fullUrl;
  document.getElementById("lbimg").alt = im.label;
  document.getElementById("lbname").textContent = im.label;
  document.getElementById("codes").textContent =
    [im.catCode, im.objectType, im.constellation].filter(Boolean).join("  ·  ");

  const b = document.getElementById("blurb");
  b.textContent = im.blurb || "A description of this object is still to be written.";
  b.classList.toggle("placeholder", !im.blurb);

  const rows = [
    ["Distance",    im.distLy ? im.distLy + " light-years" : null],
    ["Discovered",  im.foundBy],
    ["Framing",     im.hasSky ? `${fmtDeg(im.fov_w_deg)} × ${fmtDeg(im.fov_h_deg)}` : null],
    ["Telescope",   showScope(im.scope)],
    ["Camera",      showCamera(im.camera)],
    ["Filters",     showFilter(im.filters)],
    ["From",        im.location ? im.location + (im.bortle ? ` (Bortle ${im.bortle})` : "") : null],
    ["Exposure",    im.hours ? `${im.hours} hours over ${im.nights || "?"} nights` : null],
    ["Captured",    im.captured]
  ].filter(r => r[1]);

  document.getElementById("facts").innerHTML =
    rows.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");

  const stat = (ic,n,label,tip,href) => !n ? "" :
    `<${href?"a":"span"} class="stat"${href?` href="${href}" target="_blank" rel="noopener"`:""} title="${tip}">`+
    `<span class="ic">${ic}</span>${n}<span class="lb">${label}</span></${href?"a":"span"}>`;

  document.getElementById("reach").innerHTML =
    stat("\u2665", im.favourites, "favourites",
         "Favourited on AstroBin, Telescopius and AstrophotoMarket") +
    stat("\u21e3", im.downloads, "downloads",
         "People who have taken this dataset to process themselves. The raw files are free \u2014 click to grab them.",
         im.fits || "https://astrophotomarket.com/en/author/wade-tubman") +
    stat("\u21bb", im.reprocessed, "community edits",
         "Other astrophotographers who have published their own processing of this data",
         im.showcase);

  const links = [
    ["AstroBin",    im.astrobin],
    ["Telescopius", im.telescopius],
    ["See where it is", im.hasSky ? SKYDOME + "?target=" + im.slug : null]
  ].filter(l => l[1]);

  const AUTHOR = "https://astrophotomarket.com/en/author/wade-tubman";
  const menu = [
    [im.fits || AUTHOR, "The raw data",
     im.fits ? "Calibrated FITS frames, free on AstrophotoMarket"
             : "Browse my free datasets on AstrophotoMarket"],
    [im.wallpaper || im.fullUrl, "Wallpaper", "3840 \u00d7 2160 JPEG for your desktop"]
  ].filter(m => m[0]);

  document.getElementById("acts").innerHTML =
    `<span id="grab"><button type="button" id="grabbtn">Download &#9662;</button>` +
    `<div id="grabmenu">` + menu.map(([u,t,s]) =>
      `<a href="${u}" target="_blank" rel="noopener" ${u===im.fullUrl?'download':''}>${t}<span class="sub">${s}</span></a>`
    ).join("") + `</div></span>` +
    links.map(([t,u]) => `<a href="${u}" target="_blank" rel="noopener">${t}<span class="ext">&#8599;</span></a>`).join("");

  const gb = document.getElementById("grabbtn"), gm = document.getElementById("grabmenu");
  gb.onclick = e => { e.stopPropagation(); gm.classList.toggle("on"); };
  document.addEventListener("click", () => gm.classList.remove("on"), {once:true});

  // no sky coordinates means no dome position and nothing to scale the Moon against
  const dome = document.getElementById("tdome"), moonBtn = document.getElementById("tmoon");
  dome.href = SKYDOME + "?target=" + im.slug;
  dome.style.display    = im.hasSky ? "" : "none";
  moonBtn.style.display = im.hasSky ? "" : "none";
  if(!im.hasSky && moonOn){
    moonOn = false;
    document.getElementById("moonlayer").classList.remove("on");
    moonBtn.classList.remove("on");
  }

  // the Moon stays on as you step through targets, and rescales each time
  document.getElementById("moonlayer").classList.toggle("on", moonOn);
  document.getElementById("tmoon").classList.toggle("on", moonOn);
  resetZoom();
  const shownEl = document.getElementById("lbimg");
  shownEl.onload = () => { if(moonOn) drawMoon(); };
  if(moonOn && shownEl.naturalWidth) drawMoon();

  // warm the neighbours so stepping left and right is instant
  [1,-1].forEach(d => {
    const n = VIEW[(ix + d + VIEW.length) % VIEW.length];
    if(n) new Image().src = n.fullUrl;
  });

  lb.classList.add("on");
  document.body.style.overflow = "hidden";
  history.replaceState(null,"","#" + im.slug);
  document.getElementById("close").focus();
}

/* ---- zoom & pan -------------------------------------------------------
   One transform on a wrapper. Zooming keeps the point under the cursor
   fixed, which is what makes it feel like a photo viewer rather than a
   scaling animation. */
let Z = 1, PX = 0, PY = 0, drag = null;
const vp  = document.getElementById("viewport");
const pan = document.getElementById("pan");

function applyZoom(live){
  pan.classList.toggle("live", !!live);
  pan.style.transform = `translate(${PX}px,${PY}px) scale(${Z})`;
  vp.classList.toggle("zoomed", Z > 1);
  document.getElementById("zoomhint").style.opacity = Z > 1 ? 0 : "";
}
function resetZoom(){ Z = 1; PX = PY = 0; applyZoom(); }
addEventListener("fullscreenchange", () => {
  document.getElementById("tfull").classList.toggle("on", !!document.fullscreenElement);
  if(moonOn) requestAnimationFrame(drawMoon);
});

function zoomAt(cx, cy, next){
  next = Math.min(6, Math.max(1, next));
  const r = vp.getBoundingClientRect();
  const x = cx - r.left, y = cy - r.top;
  // keep (x,y) over the same pixel of the image
  PX = x - (x - PX) * (next / Z);
  PY = y - (y - PY) * (next / Z);
  Z = next;
  if(Z === 1){ PX = PY = 0; }
  applyZoom(true);
}

vp.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Z * (e.deltaY < 0 ? 1.16 : 1/1.16));
}, {passive:false});

/* Every pointerdown starts a potential drag, whatever the zoom level — the old
   version only armed it above 1x, which is why panning did nothing. A gesture
   that finishes within a few pixels is treated as a click instead. */
vp.addEventListener("dragstart", e => e.preventDefault());

/* Track every active pointer so two fingers can pinch. One pointer pans,
   two pinch about their midpoint, and a press that never moves is a tap. */
const pointers = new Map();
let pinch = null;

vp.addEventListener("pointerdown", e => {
  e.preventDefault();                       // stop the native image drag
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try{ vp.setPointerCapture(e.pointerId); }catch(err){}

  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, z: Z};
    drag = null;
  }else if(pointers.size === 1){
    drag = {x:e.clientX, y:e.clientY, px:PX, py:PY, moved:false};
  }
});

vp.addEventListener("pointermove", e => {
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()];
    zoomAt((a.x+b.x)/2, (a.y+b.y)/2, pinch.z * (Math.hypot(a.x-b.x, a.y-b.y) / pinch.d));
    return;
  }
  if(!drag) return;
  if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6) drag.moved = true;
  if(Z <= 1 || !drag.moved) return;
  vp.classList.add("dragging");
  PX = drag.px + (e.clientX - drag.x);
  PY = drag.py + (e.clientY - drag.y);
  applyZoom(true);
});

function release(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  if(pointers.size) return;
  if(drag && !drag.moved) Z > 1 ? resetZoom() : toggleSolo();
  drag = null;
  vp.classList.remove("dragging");
}
vp.addEventListener("pointerup", release);
vp.addEventListener("pointercancel", release);

/* Collapse the info panel so the photo has the whole window. Distinct from
   browser full screen, which is the button. */
function toggleSolo(){
  lb.classList.toggle("solo");
  resetZoom();
  requestAnimationFrame(() => { if(moonOn) drawMoon(); });
}

function goFullscreen(){
  (document.fullscreenElement ? document.exitFullscreen() : lb.requestFullscreen()).catch(()=>{});
}

function fmtDeg(d){
  return d >= 1 ? d.toFixed(2) + "°" : Math.round(d*60) + "′";
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

/* Scale the Moon against the actual plate-solved field, then draw it on the image. */
function toggleMoon(){
  moonOn = !moonOn;
  document.getElementById("tmoon").classList.toggle("on", moonOn);
  document.getElementById("moonlayer").classList.toggle("on", moonOn);
  if(moonOn) drawMoon();
}
document.getElementById("tmoon").onclick = toggleMoon;
document.getElementById("tfull").onclick = goFullscreen;

/* object-fit:contain letterboxes the photo inside the element, so the
   drawn width is not the element width — work out the real one first. */
function drawMoon(){
  const im    = VIEW[CUR];
  if(!im || !im.hasSky) return;
  const shown = document.getElementById("lbimg");
  const layer = document.getElementById("moonlayer");
  if(!im || !shown.naturalWidth) return;

  const boxW = shown.clientWidth, boxH = shown.clientHeight;
  const drawnW = Math.min(boxW, boxH * (shown.naturalWidth / shown.naturalHeight));

  layer.style.width = Math.max(drawnW * (MOON_DEG / im.fov_w_deg), 3) + "px";
}

function shut(){
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  moonOn = false;
  document.getElementById("moonlayer").classList.remove("on");
  document.getElementById("tmoon").classList.remove("on");
  lb.classList.remove("on","solo");
  resetZoom();
  document.body.style.overflow = "";
  history.replaceState(null,"",location.pathname);
}
const step = d => { if(VIEW.length) open((CUR + d + VIEW.length) % VIEW.length); };

document.getElementById("close").onclick = shut;
document.getElementById("prev").onclick  = () => step(-1);
document.getElementById("next").onclick  = () => step(1);
addEventListener("keydown", e => {
  if(!lb.classList.contains("on")) return;
  if(e.key === "Escape"){
    if(Z > 1) resetZoom();
    else if(lb.classList.contains("solo")) toggleSolo();
    else shut();
  }
  if(e.key === "f") goFullscreen();
  if(e.key === "m") toggleMoon();
  if(e.key === "ArrowLeft")  step(-1);
  if(e.key === "ArrowRight") step(1);
});
addEventListener("resize", () => { if(moonOn) drawMoon(); });

function openFromHash(){
  const h = location.hash.slice(1);
  if(!h) return;
  const ix = VIEW.findIndex(i => i.slug === h);
  if(ix >= 0) open(ix);
}

/* ==========================================================================
   THEME — follow the operating system first, remember a manual choice after
   ========================================================================== */
const btnTheme = document.getElementById("theme");
function setTheme(t){
  document.documentElement.dataset.theme = t;
  btnTheme.textContent = t === "light" ? "Dark" : "Light";
  btnTheme.setAttribute("aria-label", `Switch to ${t === "light" ? "dark" : "light"} theme`);
}
// Dark unless the visitor has explicitly asked for light — photographs read
// badly on a pale background, so the OS preference does not get a vote here.
setTheme(localStorage.getItem("theme") || "dark");
btnTheme.onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("theme", t);
  setTheme(t);
};

document.getElementById("q").oninput     = render;
const DESC_FIRST = new Set(["likes"]);
document.getElementById("sort").onchange = e => {
  ASC = !DESC_FIRST.has(e.target.value);
  document.getElementById("dir").textContent = ASC ? "\u2191" : "\u2193";
  render();
};

document.getElementById("seek").onclick = () => {
  const box = document.getElementById("q");
  box.classList.toggle("open");
  if(box.classList.contains("open")) box.focus();
  else { box.value = ""; render(); }
};
document.getElementById("dir").onclick = e => {
  ASC = !ASC;
  e.currentTarget.textContent = ASC ? "\u2191" : "\u2193";
  render();
};
boot();
</script>
