<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wade Tubman — Astrophotography</title>
<meta name="description" content="Deep-sky astrophotography from Sydney and the dark skies of New South Wales.">
<meta property="og:title" content="Wade Tubman — Astrophotography">
<meta property="og:description" content="Deep-sky astrophotography from Sydney and the dark skies of New South Wales.">
<meta property="og:type" content="website">
<link rel="icon" href="logo-light-on-dark.png">
<style>
/* ============================================================
   PALETTE
   dark  = skydome's ember-on-black
   light = the processing tracker's parchment + amber
   ============================================================ */
:root{
  --bg:#060201; --panel:#0f0402; --panel2:#150603; --edge:#43170f;
  --ink:#ffb694; --dim:#a8543c; --hot:#ffcf6b; --pick:#7fffd4;
  --shadow:rgba(0,0,0,.7);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  --logo:url("logo-light-on-dark.png");
}
html[data-theme="light"]{
  --bg:#ede5d2; --panel:#f8f4ea; --panel2:#f2ebdc; --edge:#d3c2a4;
  --ink:#2b2119; --dim:#7a6a56; --hot:#b45309; --pick:#0f766e;
  --shadow:rgba(60,45,25,.22);
  --logo:url("logo-dark-on-light.png");
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pick); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- masthead ---------- */
header{
  position:relative; height:min(52vh,470px); min-height:290px;
  display:grid; place-items:center; overflow:hidden;
  background:#000; border-bottom:1px solid var(--edge);
}
#heroimg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:50% 50%;
  opacity:0; transition:opacity 1.1s ease;
}
#heroimg.in{opacity:1}
#scrim{
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,.62),rgba(0,0,0,.30) 46%,rgba(0,0,0,.74));
}
#herotext{position:relative; text-align:center; padding:0 24px}
#logo{
  width:min(360px,66vw); height:calc(min(360px,66vw) * 0.349);
  margin:0 auto;
  background:url("logo-light-on-dark.png") center/contain no-repeat;
}
#tagline{
  margin:14px auto 0; max-width:50ch;
  color:rgba(255,255,255,.80); font-size:14.5px;
  text-shadow:0 1px 12px rgba(0,0,0,.9);
}
#tally{
  margin-top:9px; font-family:var(--mono); font-size:11.5px;
  letter-spacing:.05em; color:rgba(255,255,255,.60);
}
#tally b{color:#ffcf6b; font-weight:600}
#herocap{
  position:absolute; right:13px; bottom:10px; z-index:2;
  font-family:var(--mono); font-size:10px; letter-spacing:.05em;
  color:rgba(255,255,255,.5); text-decoration:none;
}
#herocap:hover{color:#ffcf6b}
@media (max-width:640px){ header{height:38vh; min-height:230px} }

/* ---------- controls ---------- */
#bar{
  position:sticky; top:0; z-index:40;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  padding:11px 20px; background:var(--panel);
  border-bottom:1px solid var(--edge);
}
#chips{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 auto}
.chip{
  padding:6px 13px; border:1px solid var(--edge); border-radius:999px;
  font-size:13px; background:var(--bg); white-space:nowrap;
}
.chip:hover{border-color:var(--hot)}
.chip.on{background:var(--hot); border-color:var(--hot); color:var(--bg); font-weight:600}
.chip .n{opacity:.55; font-size:11px; margin-left:5px}
#seek{padding:7px 11px; border:1px solid var(--edge); border-radius:3px; background:var(--bg); font-size:14px}
#seek:hover{border-color:var(--hot); color:var(--hot)}
#q{
  display:none; width:100%; order:9; padding:8px 12px;
  background:var(--bg); color:var(--ink);
  border:1px solid var(--edge); border-radius:3px; font-size:14px;
}
#q.open{display:block}
#q::placeholder{color:var(--dim)}
#dir{
  padding:8px 11px; border:1px solid var(--edge); border-radius:3px;
  background:var(--bg); font-size:14px; min-width:36px;
}
#dir:hover{border-color:var(--hot); color:var(--hot)}
#sort{
  padding:8px 10px; background:var(--bg); color:var(--ink);
  border:1px solid var(--edge); border-radius:3px; font-size:14px;
}
#theme{
  padding:8px 13px; border:1px solid var(--edge); border-radius:3px;
  font-size:13px; letter-spacing:.03em; background:var(--bg);
}
#theme:hover{border-color:var(--hot); color:var(--hot)}

/* ---------- justified grid ---------- */
main{padding:20px}
#grid{display:flex; flex-wrap:wrap; gap:9px; max-width:2000px; margin:0 auto}
#grid::after{content:""; flex-grow:1e6}   /* keeps the last row left-aligned */
figure{
  position:relative; margin:0; height:250px;
  overflow:hidden; background:var(--panel2); cursor:pointer;
  border-radius:2px;
}
figure img{
  display:block; width:100%; height:100%; object-fit:cover;
  transition:transform .35s ease, filter .35s ease;
}
figure:hover img,figure:focus-within img{transform:scale(1.035); filter:brightness(1.08)}
figcaption{
  position:absolute; inset:auto 0 0 0; padding:26px 12px 9px;
  background:linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.45) 55%,transparent);
  color:#fff; pointer-events:none;
}
.cap-name{font-size:14px; font-weight:600; line-height:1.25}
.cap-meta{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
  color:rgba(255,255,255,.72); margin-top:3px;
  display:flex; gap:9px; align-items:center;
}
.cap-meta .likes{color:#ffcf6b}
#reach{display:flex; gap:20px; margin-top:20px; flex-wrap:wrap}
#reach:empty{display:none}
.stat{
  display:flex; align-items:baseline; gap:6px;
  font-family:var(--mono); font-size:15px; color:var(--hot);
  text-decoration:none; cursor:default;
}
a.stat{cursor:pointer}
a.stat:hover{color:var(--pick)}
.stat .ic{font-size:14px; line-height:1}
.stat .lb{font-family:var(--sans); font-size:11.5px; color:var(--dim)}
@media (max-width:760px){ figure{height:180px} main{padding:12px} }


/* Nebula Nest (and future site) badge on the card and in the detail view */
.nest-badge{
  display:inline-flex; align-items:center; justify-content:center;
  background:#0a0614; border:1px solid rgba(180,120,255,.35);
  border-radius:8px; padding:3px 7px; line-height:0;
  text-decoration:none;
}
.nest-badge img{display:block; width:auto; height:36px}
figure .nest-badge{
  position:absolute; top:8px; right:8px; z-index:3;
  pointer-events:auto;
}
#sitebadge{margin:10px 0 0}
#sitebadge:empty{display:none}
#sitebadge .nest-badge img{height:52px}
#sitebadge .nest-badge{padding:4px 8px}


/* ---------- lightbox ---------- */
#lb{
  position:fixed; inset:0; z-index:100; display:none;
  background:var(--bg);
}
#lb.on{display:grid; grid-template-columns:1fr 372px; grid-template-rows:minmax(0,1fr)}
#lb.solo{grid-template-columns:1fr}
#lb.solo #info{display:none}
#lb.solo #next{right:14px}
#stage{
  position:relative; display:block; overflow:hidden;
  padding:22px; min-width:0; min-height:0; background:#000;
  touch-action:none;
}
#viewport{
  position:absolute; inset:22px; overflow:hidden;
  display:grid; place-items:center; cursor:zoom-in;
}
#viewport{cursor:zoom-in}
#lb.solo #viewport{cursor:zoom-out}
#viewport.zoomed{cursor:grab}
#viewport.dragging{cursor:grabbing}
#pan{
  position:absolute; inset:0;
  transform-origin:0 0; will-change:transform;
  transition:transform .22s cubic-bezier(.22,.7,.3,1);
}
#pan.live{transition:none}
#zoomhint{
  position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
  z-index:3; font-family:var(--mono); font-size:10px; letter-spacing:.05em;
  color:rgba(255,255,255,.34); pointer-events:none;
  transition:opacity .3s;
}
#tools{
  position:absolute; right:14px; top:14px; z-index:5;
  display:flex; gap:8px;
}
#tools button, #tools a{
  width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center; font-size:16px;
  background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.16);
}
#tools a{text-decoration:none}
#tools button:hover, #tools a:hover{background:var(--hot); color:#000; border-color:var(--hot)}
#tools button.on{background:var(--hot); color:#000; border-color:var(--hot)}
/* narration (v0.24): speaker button, subtle pulse while playing */
#tvoice[hidden]{display:none}
#tvoice.playing{background:var(--hot); color:#000; border-color:var(--hot); animation:vpulse 1.6s ease-in-out infinite}
#thear[hidden]{display:none}
#thear.playing{border-color:var(--hot); color:var(--hot)}
#listen{display:flex; flex-wrap:wrap; gap:8px}
@keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,107,.55)}50%{box-shadow:0 0 0 7px rgba(255,207,107,0)}}
html[data-theme="light"] #stage{background:#111}
#stage #lbimg{
  display:block; width:100%; height:100%;
  object-fit:contain; object-position:center;
  -webkit-user-drag:none; user-select:none; -webkit-user-select:none;
}
#stage #moonlayer{
  position:absolute; left:50%; top:50%; translate:-50% -50%;
  pointer-events:none; opacity:.9; display:none;
  max-width:none; max-height:none; height:auto;
  filter:drop-shadow(0 0 20px rgba(0,0,0,.95));
}
#stage #moonlayer.on{display:block}
#stage #lbvid{display:none; width:100%; height:100%; object-fit:contain; background:#000}
#lb.video #lbvid{display:block}
#lb.video #lbimg{display:none}

/* versions of one target: thumbnails along the bottom of the photo */
#vers{
  position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:6;
  display:flex; gap:7px; padding:6px; max-width:calc(100% - 130px); overflow-x:auto;
  background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.12); border-radius:6px;
}
#vers:empty{display:none}
#vers button{
  position:relative; flex:0 0 auto; width:88px; height:56px; padding:0;
  border:2px solid transparent; border-radius:3px; overflow:hidden; background:#000;
}
#vers button.on{border-color:var(--hot)}
#vers button:hover{border-color:rgba(255,207,107,.6)}
#vers img{display:block; width:100%; height:100%; object-fit:cover}
#vers .tag{
  position:absolute; inset:auto 0 0 0; padding:1px 4px; text-align:left;
  font:9.5px/1.4 var(--mono); color:#fff; background:rgba(0,0,0,.62);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#vers .play{position:absolute; inset:0 0 12px 0; display:grid; place-items:center;
  font-size:20px; color:#fff; text-shadow:0 0 8px #000}
.cap-meta .vers{color:#ffcf6b; opacity:.85}
#vers:not(:empty) + #zoomhint{bottom:5px}
@media (max-width:900px){ #vers{bottom:8px; max-width:calc(100% - 16px)} #vers button{width:70px; height:46px}
  #vers:not(:empty) + #zoomhint{display:none} }

#info{
  padding:26px 26px 60px; overflow-y:auto;
  background:var(--panel); border-left:1px solid var(--edge);
}
#info h2{margin:0; font-size:24px; line-height:1.2; font-weight:600}
#codes{
  font-family:var(--mono); font-size:12px; color:var(--dim);
  margin-top:6px; letter-spacing:.04em;
}
#blurb{margin:20px 0 0; font-size:14.5px; line-height:1.68; max-width:46ch; white-space:pre-wrap}
#blurb.placeholder{color:var(--dim); font-style:italic}

dl{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; margin:24px 0 0; font-size:13px}
dt{color:var(--dim)}
dd{margin:0; font-family:var(--mono); font-size:12.5px}

#acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:26px}
#acts a,#acts button{
  padding:8px 13px; border:1px solid var(--edge); border-radius:3px;
  font-size:13px; text-decoration:none; background:var(--bg);
}
#acts a:hover,#acts button:hover{border-color:var(--hot); color:var(--hot)}
#acts .ext{opacity:.5; font-size:11px; margin-left:5px}
#grab{position:relative}
#grabmenu{
  position:absolute; left:0; top:calc(100% + 6px); z-index:20; min-width:250px;
  background:var(--panel2); border:1px solid var(--edge); border-radius:4px;
  box-shadow:0 12px 34px var(--shadow); overflow:hidden; display:none;
}
#grabmenu.on{display:block}
#grabmenu a{
  display:block; padding:11px 14px; text-decoration:none; font-size:13px;
  border-bottom:1px solid var(--edge);
}
#grabmenu a:last-child{border-bottom:0}
#grabmenu a:hover{background:var(--bg); color:var(--hot)}
#grabmenu .sub{display:block; font-size:11.5px; color:var(--dim); margin-top:2px}

#close,#prev,#next{
  position:fixed; z-index:110; width:44px; height:44px;
  display:grid; place-items:center; font-size:22px; line-height:1;
  background:rgba(0,0,0,.55); color:#fff; border-radius:50%;
}
#close{top:14px; left:14px}
#prev{top:50%; left:14px; transform:translateY(-50%)}
#next{top:50%; left:auto; right:calc(372px + 14px); transform:translateY(-50%)}
#close:hover,#prev:hover,#next:hover{background:var(--hot); color:#000}

@media (max-width:900px){
  #lb.on{grid-template-columns:1fr; grid-template-rows:52vh minmax(0,1fr)}
  #lb.solo{grid-template-rows:minmax(0,1fr)}
  #lb.solo #stage{padding:0}
  #lb.solo #viewport{inset:0}
  #info{border-left:0; border-top:1px solid var(--edge); padding:20px 20px 50px}
  #next{right:14px}
  #prev,#next{top:26vh}
}

footer{
  padding:44px 24px 60px; text-align:center;
  border-top:1px solid var(--edge); color:var(--dim); font-size:13px;
}
footer a{color:var(--hot); text-decoration:none}
footer a:hover{text-decoration:underline}
/* ---------- info popups: discoverer, constellation, telescope (v0.22) ---------- */
dd .pl{
  font:inherit; color:inherit; text-align:left; padding:0; cursor:pointer;
  text-decoration:underline dotted; text-decoration-color:var(--dim); text-underline-offset:3px;
}
dd .pl:hover{color:var(--hot); text-decoration-color:var(--hot)}
#pop{
  position:fixed; inset:0; z-index:200; display:none; place-items:center;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  background:rgba(0,0,0,.66);
}
#pop.on{display:grid}
#popcard{
  position:relative; width:min(560px,100%); max-height:100%; overflow-y:auto;
  background:var(--panel); color:var(--ink); border:1px solid var(--edge); border-radius:6px;
  box-shadow:0 18px 50px var(--shadow); overscroll-behavior:contain;
}
#popfig{margin:0; background:#000; display:grid; place-items:center}
#popfig.chart{background:#fff}
#popfig[hidden]{display:none}
#popimg{display:block; max-width:100%; max-height:min(64vh,640px); object-fit:contain}
#poptext{padding:16px 20px 18px}
#poptitle{margin:0 34px 0 0; font-size:19px; line-height:1.25; font-weight:600}
#popsub{margin:6px 0 0; font-size:14px; line-height:1.5}
#popcredit{margin:12px 0 0; font-size:11.5px; line-height:1.5; color:var(--dim)}
#popcredit a,#poplinks a,#poplist a{color:var(--hot); text-decoration:none}
#popcredit a:hover,#poplinks a:hover,#poplist a:hover{text-decoration:underline}
#poplinks{margin:12px 0 0; font-size:13px}
#poplinks:empty,#popcredit:empty,#popsub:empty{display:none}
#poplist{font-size:12.5px; line-height:1.5; margin-top:10px}
#poplist h4{margin:16px 0 6px; font-size:13px; color:var(--ink)}
#poplist ul{margin:0; padding-left:18px; color:var(--dim)}
#poplist:empty{display:none}
#popx{
  position:absolute; top:10px; right:10px; z-index:2; width:36px; height:36px;
  display:grid; place-items:center; font-size:17px; line-height:1; border-radius:50%;
  background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.18);
}
#popx:hover{background:var(--hot); color:#000; border-color:var(--hot)}
/* docked asset card (v0.23): small, non-modal, bottom-right of the photo */
#acard{
  position:absolute; right:14px; bottom:14px; z-index:7; display:none;
  width:375px; max-width:calc(100% - 28px); max-height:calc(100% - 90px); overflow:hidden auto;
  background:var(--panel); color:var(--ink); border:1px solid var(--edge); border-radius:5px;
  box-shadow:0 8px 24px var(--shadow); font-size:12px; line-height:1.4;
}
#acard.on{display:block}
#stage:has(#vers:not(:empty)) #acard{bottom:96px}
#acfig{background:#000; display:grid; place-items:center}
#acfig.chart{background:#fff}
#acfig[hidden]{display:none}
#acimg{display:block; max-width:100%; max-height:min(30vh,300px); object-fit:contain}
/* keep the card's top below the prev/next arrows, which sit at mid-height */
#stage:has(#vers:not(:empty)) #acimg{max-height:min(19vh,190px)}
@media (min-width:901px) and (max-height:760px){ #acimg{max-height:22vh} #stage:has(#vers:not(:empty)) #acimg{max-height:12vh} }
#actext{padding:10px 13px 11px}
#actitle{margin:0 26px 0 0; font-size:15px; line-height:1.25; font-weight:600}
#acsub{margin:4px 0 0; font-size:13px}
#accredit{margin:6px 0 0; font-size:11.5px; color:var(--dim)}
#accredit a{color:var(--hot); text-decoration:none}
#accredit a:hover{text-decoration:underline}
#acsub:empty,#accredit:empty{display:none}
#acx{
  position:absolute; top:6px; right:6px; z-index:2; width:26px; height:26px;
  display:grid; place-items:center; font-size:12px; line-height:1; border-radius:50%;
  background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.18);
}
#acx:hover{background:var(--hot); color:#000; border-color:var(--hot)}
@media (max-width:900px){
  /* phone: a compact strip, image on the left, below the prev/next arrows */
  #acard{right:8px; bottom:8px; width:min(300px, calc(100% - 16px)); max-height:42%;
    display:none; grid-template-columns:auto 1fr}
  #acard.on{display:grid}
  #stage:has(#vers:not(:empty)) #acard{bottom:66px}
  #acimg{max-height:min(16vh,110px); max-width:110px}
  #actext{padding:7px 9px}
  #actitle{font-size:12.5px}
  #acsub,#accredit{font-size:10.5px}
  #acsub{margin:3px 0 0} #accredit{margin:5px 0 0}
}

#creditsbtn{color:var(--hot); font-size:13px; padding:0}
#creditsbtn:hover{text-decoration:underline}
@media (max-width:600px){ #popimg{max-height:52vh} #poptext{padding:14px 16px 16px} }

#status{padding:60px 24px; text-align:center; color:var(--dim); font-family:var(--mono); font-size:13px}
</style>
</head>
<body>

<header>
  <img id="heroimg" alt="" aria-hidden="true">
  <div id="scrim"></div>
  <div id="herotext">
    <div id="logo" role="img" aria-label="Wade Tubman Astrophotography"></div>
    <p id="tagline">Deep-sky imaging from a Bortle&nbsp;7 backyard in Sydney, and from the dark skies of New South Wales.</p>
    <p id="tally"></p>
  </div>
  <a id="herocap" href="#"></a>
</header>

<div id="bar">
  <div id="chips"></div>
  <button id="seek" type="button" aria-label="Search" title="Search">⌕</button>
  <select id="sort" aria-label="Sort by">
    <option value="date">Capture date</option>
    <option value="ra">Sky position</option>
    <option value="name">Name</option>
    <option value="distance">Distance</option>
    <option value="fov">Field of view</option>
    <option value="hours">Exposure</option>
    <option value="likes">Popularity</option>
  </select>
  <button id="dir" type="button" aria-label="Reverse sort order">↑</button>
  <button id="theme" type="button">Light</button>
  <input id="q" type="search" placeholder="Search by name, catalogue or constellation" aria-label="Search images">
</div>

<main><div id="grid"></div></main>
<p id="status">Loading the catalogue…</p>

<footer>
  <p>Images © Wade Tubman. All rights reserved.</p>
  <p><button id="creditsbtn" type="button">Portrait and chart credits</button></p>
  <p style="font-family:var(--mono);font-size:11px;opacity:.6;margin-top:26px">
    v0.28 · built with Claude
  </p>
  <p style="color:var(--dim);margin-bottom:6px">Also find my work at</p>
  <p>
    <a href="https://tubbers.github.io/skydome/" target="_blank" rel="noopener">Sky dome</a> ·
    <a href="https://app.astrobin.com/u/tubbers" target="_blank" rel="noopener">AstroBin</a> ·
    <a href="https://telescopius.com/profile/tubbers" target="_blank" rel="noopener">Telescopius</a> ·
    <a href="https://astrophotomarket.com/en/author/wade-tubman" target="_blank" rel="noopener">AstrophotoMarket</a>
  </p>
</footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Image detail">
  <div id="stage">
    <div id="viewport">
      <div id="pan"><img id="lbimg" alt="" draggable="false"><video id="lbvid" muted loop playsinline preload="none" disablepictureinpicture></video></div>
      <img id="moonlayer" src="moon.png" alt="The full Moon at the same scale">
    </div>
    <div id="tools">
      <button id="tfull" type="button" title="Full screen" aria-label="Full screen">&#9974;</button>
      <button id="tmoon" type="button" title="Compare with the Moon" aria-label="Compare with the Moon">&#9790;</button>
      <button id="tvoice" type="button" title="Play the narration" aria-label="Play the narration" aria-pressed="false" hidden>&#128264;</button>
      <a id="tdome" href="#" target="_blank" rel="noopener" title="See where it is in the sky" aria-label="See where it is in the sky">&#9673;</a>
    </div>
    <div id="vers" role="group" aria-label="Versions of this target"></div>
    <p id="zoomhint">scroll to zoom</p>
    <aside id="acard" aria-live="polite" aria-label="About this detail">
      <button id="acx" type="button" aria-label="Close">✕</button>
      <div id="acfig"><img id="acimg" alt=""></div>
      <div id="actext">
        <h3 id="actitle"></h3>
        <p id="acsub"></p>
        <p id="accredit"></p>
      </div>
    </aside>
  </div>
  <div id="info">
    <h2 id="lbname"></h2>
    <div id="sitebadge"></div>
    <p id="codes"></p>
    <p id="blurb"></p>
    <div id="reach"></div>
    <dl id="facts"></dl>
    <div id="acts"></div>
  </div>
  <button id="close" type="button" aria-label="Close">✕</button>
  <button id="prev" type="button" aria-label="Previous image">‹</button>
  <button id="next" type="button" aria-label="Next image">›</button>
</div>

<div id="pop" role="dialog" aria-modal="true" aria-labelledby="poptitle">
  <div id="popcard">
    <button id="popx" type="button" aria-label="Close">✕</button>
    <div id="popfig"><img id="popimg" alt=""></div>
    <div id="poptext">
      <h3 id="poptitle"></h3>
      <p id="popsub"></p>
      <p id="popcredit"></p>
      <p id="poplinks"></p>
      <div id="poplist"></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   CONFIG — the only bits you'd ever need to change
   ========================================================================== */
// where the images live. A local preview (localhost only) may point this at a
// scratch copy with ?skydome=/path/ - never honoured on the public site.
const SKYDOME   = (() => {
  const live = "https://tubbers.github.io/skydome/";
  if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return live;
  const o = new URLSearchParams(location.search).get("skydome");
  return o && /^\/[\w\/.-]*\/$/.test(o) ? o : live;
})();
const MOON_DEG  = 0.518;                                  // Moon's apparent diameter

/* ==========================================================================
   DATA LOADING
   Three files, only the first is required:
     1. skydome/manifest.json  — images + plate solve + distance   (remote)
     2. targets.json           — your planning list, for constellation + type
     3. gallery.json           — per-image blurbs, gear, hours     (optional)
   ========================================================================== */
let IMAGES = [], TARGETS = [], VIEW = [], CUR = -1;
let ITEMS = [], IT = 0;      // what the lightbox can show for the open target, and which one
let ASSETS = null;           // assets.json: popup pictures for discoverers, constellations, telescopes

const url = p => SKYDOME + p.split("/").map(encodeURIComponent).join("/");
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const num  = s => { const n = parseFloat(String(s ?? "").replace(/,/g,"")); return isFinite(n) ? n : null; };

/* Light-years are the wrong unit inside the solar system - the Sun would read
   0.0000158 ly. Under a hundredth of a light-year, switch to light-minutes. */
function fmtDist(v){
  const n = num(v);
  if(n === null) return v ? String(v) : null;
  if(n < 0.01) return (n * 525600).toFixed(1) + " light-minutes";
  return n.toLocaleString("en-AU") + " light-years";
}

// Presentation only — gallery.json keeps the raw values.
const OPTICS = {
  "200PDS":       "200PDS Newtonian \u2014 950mm",
  "ASKAR 91F":    "Askar 91F \u2014 610mm",
  "RedCat 61":    "RedCat 61 \u2014 300mm",
  "RedCat 51":    "RedCat 51 \u2014 250mm",
  "Pentax 135mm": "Pentax 135mm \u2014 135mm",
  "Seestar S50":  "Seestar S50 \u2014 250mm",
  "DWARF Mini":   "DWARF Mini \u2014 150mm",
  "GSO 150":      "GSO 150 Newtonian \u2014 750mm"
};
const showScope  = s => s ? (OPTICS[s] || s) : null;
const showCamera = c => c ? (/1600MM|2600MM/.test(c) ? c + " (mono)" : c) : null;
const showFilter = f => !f ? null
  : /^(osc )?broadband$/i.test(f.trim()) ? "None" : f;

// Roll the catalogue's granular types up into something a visitor can use.
const BUCKETS = {
  "Nebulae":     ["Emission Nebula","HII Region"],
  "Galaxies":    ["Spiral Galaxy","Barred Spiral Galaxy","Peculiar Galaxy","Galaxy","Group of Galaxies"],
  "Clusters":    ["Globular Cluster","Open Cluster"],
  "Dust & dark": ["Reflection Nebula","Dark Nebula","Dense Core","Star Forming Region"],
  "Remnants":    ["Supernova Remnant","Planetary Nebula"]
};
function bucket(t){
  if(!t) return null;
  for(const [name,list] of Object.entries(BUCKETS)) if(list.includes(t)) return name;
  return null;
}

// angular separation between two sky positions, in degrees
function sep(ra1,de1,ra2,de2){
  const R = Math.PI/180;
  const v = Math.sin(de1*R)*Math.sin(de2*R)
          + Math.cos(de1*R)*Math.cos(de2*R)*Math.cos((ra1-ra2)*R);
  return Math.acos(Math.max(-1,Math.min(1,v)))/R;
}

async function grab(u){
  try{ const r = await fetch(u,{cache:"no-store"}); return r.ok ? await r.json() : null; }
  catch(e){ return null; }
}

async function boot(){
  const [man,targets,extra,assets] = await Promise.all([
    grab(SKYDOME+"manifest.json"),
    grab("targets.json"),
    grab("gallery.json"),
    grab("assets.json")
  ]);
  ASSETS = assets;

  if(!man || !man.images){
    document.getElementById("status").textContent =
      "Couldn't reach the skydome catalogue. Check that " + SKYDOME + "manifest.json is published.";
    return;
  }

  const byLabel = {};
  (Array.isArray(extra) ? extra : (extra && extra.images) || []).forEach(e => { if(e.label) byLabel[e.label] = e; });

  // Unsolved entries are normally dome-only rejects, but the solar-system
  // ones are explicitly flagged for the gallery — let those through.
  IMAGES = man.images.filter(i => i.solved !== false || i.kind === "solar-system").map(im => {
    const ov = byLabel[im.label] || {};

    // match against the planning list by sky position — no name-wrangling needed
    let cat = null;
    if(Array.isArray(targets)){
      let best = null;
      for(const t of targets){
        if(t.ra == null || t.dec == null) continue;
        const d = sep(im.ra_deg, im.dec_deg, t.ra, t.dec);
        if(!best || d < best.d) best = {d, t};
      }
      const tol = Math.max(im.fov_w_deg, im.fov_h_deg) * 0.75;
      if(best && best.d <= tol) cat = best.t;
    }

    return {
      ...im,
      slug:      im.slug || slug(im.label),
      name:      ov.name ?? null,        // overrides a junk label from the manifest
      thumbUrl:  url(im.thumb),
      fullUrl:   url(im.file),
      videoUrl:  im.video  ? url(im.video)  : null,
      posterUrl: im.poster ? url(im.poster) : null,
      // several shots of one target share a gallery.json "group"; "lead" is
      // the one on the grid and the one a click opens first
      gkey:      ov.group || null,
      lead:      ov.lead === true,
      ratio:     (im.width_px && im.height_px) ? im.width_px/im.height_px : 1.5,
      hasSky:    im.ra_deg != null && im.fov_w_deg > 0,
      // overrides win, then the coordinate match, then nothing
      // Facts come from the manifest — skydome is the single source of truth.
      // gallery.json only carries editorial prose and things the manifest can't know.
      // gallery.json wins, then the manifest, then the coordinate match. A new
      // image solved by solve_async has geometry but no research fields, so
      // gallery.json is the only place those can come from.
      constellation: ov.constellation ?? im.constellation ?? cat?.constellation ?? null,
      objectType:    ov.type          ?? cat?.type          ?? null,
      catCode:       ov.code          ?? cat?.name          ?? null,
      distLy:        ov.distance_ly   ?? im.distance_ly   ?? null,
      distNote:      ov.distance_note ?? im.distance_note ?? null,
      foundBy:       ov.discovered_by ?? im.discovered_by ?? null,
      blurb:         ov.blurb         ?? im.description     ?? null,
      scope:         ov.scope         ?? null,
      camera:        ov.camera        ?? null,
      filters:       ov.filters       ?? null,
      location:      ov.location      ?? null,
      bortle:        ov.bortle        ?? null,
      hours:         ov.hours         ?? null,
      nights:        ov.nights        ?? null,
      captured:      ov.captured      ?? null,
      // "2026-09-11 to 2026-09-12" or "2026-09-12" - the first date sorts it
      capturedAt:    (() => {
        const d = (ov.captured || "").match(/\d{4}-\d{2}-\d{2}/);
        return d ? Date.parse(d[0]) : null;
      })(),
      astrobin:      ov.astrobin      ?? null,
      telescopius:   ov.telescopius   ?? null,
      fits:          ov.amp_id && ov.amp_slug
                       ? `https://astrophotomarket.com/en/image-details/${ov.amp_id}/${ov.amp_slug}`
                       : (ov.fits ?? null),
      showcase:      ov.amp_id
                       ? `https://astrophotomarket.com/en/showcase-gallery?dataset=${ov.amp_id}`
                       : null,
      wallpaper:     ov.wallpaper     ?? null,
      downloads:     ov.downloads      ?? 0,
      favourites:    (ov.favourites ?? 0) + (ov.astrobin_likes ?? 0) + (ov.telescopius_likes ?? 0),
      reprocessed:   ov.reprocessed    ?? 0,
      featured:      ov.featured === true,
      site:          ov.site          ?? null,
      group:         bucket(ov.type ?? cat?.type ?? null)
    };
  });

  document.getElementById("status").remove();

  // One grid tile per target. A version keeps its own slug, so an old #link
  // to any version still opens it - inside its target.
  const byKey = new Map();
  for(const im of IMAGES){
    const k = im.gkey ? "g:" + im.gkey : "s:" + im.slug;
    if(!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(im);
  }
  const when = i => i.capturedAt ?? -8.64e15;
  TARGETS = [...byKey.values()].map(list => {
    list.sort((a,b) => (b.lead - a.lead) || (when(b) - when(a)));
    list.forEach(v => { v.leadOf = list[0]; });
    list[0].versions = list;
    return list[0];
  });

  const withHrs = IMAGES.filter(i => i.hours);
  const total   = withHrs.reduce((a,i) => a + i.hours, 0);
  document.getElementById("tally").innerHTML =
    `<b>${IMAGES.length}</b> images` + (total ? ` · <b>${Math.round(total)}</b> hours of exposure` : "");

  hero();
  chips();
  render();
  openFromHash();
}

/* Pick the banner: anything flagged `featured` in gallery.json, else the
   widest field on the list, which reads best cropped to a letterbox. */
function hero(){
  const picks = IMAGES.filter(i => i.featured);
  // A banner is a wide letterbox, so a portrait frame loses most of itself to
  // the crop. Prefer landscape, then widest field.
  const pool = picks.length ? picks : TARGETS.filter(i => i.ratio >= 1.3 && i.hasSky);
  const im = pool.length
    ? [...pool].sort((a,b) => (b.fov_w_deg*b.fov_h_deg)-(a.fov_w_deg*a.fov_h_deg))[0]
    : IMAGES[0];
  if(!im) return;
  const el = document.getElementById("heroimg");
  el.src = im.fullUrl;
  el.onload = () => el.classList.add("in");
  const cap = document.getElementById("herocap");
  cap.textContent = im.name || im.label;
  cap.href = "#" + im.slug;
  cap.onclick = e => { e.preventDefault(); openSlug(im.slug); };
}

function chips(){
  const counts = {};
  TARGETS.forEach(i => { if(i.group) counts[i.group] = (counts[i.group]||0)+1; });
  const box = document.getElementById("chips");
  box.innerHTML = "";
  Object.keys(BUCKETS).filter(n => counts[n]).forEach(name => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed","false");
    b.innerHTML = `${name}<span class="n">${counts[name]}</span>`;
    b.onclick = () => {
      PICKED.has(name) ? PICKED.delete(name) : PICKED.add(name);
      b.classList.toggle("on", PICKED.has(name));
      b.setAttribute("aria-pressed", PICKED.has(name));
      render();
    };
    box.appendChild(b);
  });
}


/* Optional gallery.json "site" field. "nebula-nest" marks images taken at
   the Nebula Nest (https://nebulanest.com.au). Unknown values are ignored. */
const SITES = {
  "nebula-nest": {
    href: "https://nebulanest.com.au",
    src: "nest-logo.png",
    alt: "Captured at the Nebula Nest",
    title: "Captured at the Nebula Nest"
  }
};
function siteBadge(site){
  const s = SITES[site];
  if(!s) return null;
  const a = document.createElement("a");
  a.className = "nest-badge";
  a.href = s.href;
  a.target = "_blank";
  a.rel = "noopener";
  a.title = s.title;
  const img = document.createElement("img");
  img.src = s.src;
  img.alt = s.alt;
  a.appendChild(img);
  a.addEventListener("click", e => e.stopPropagation());
  return a;
}

/* ==========================================================================
   GRID
   ========================================================================== */
let PICKED = new Set(), ASC = false;    // opens on capture date, newest first

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const s = document.getElementById("sort").value;

  VIEW = TARGETS.filter(i =>
    (!PICKED.size || PICKED.has(i.group)) &&
    (!q || i.versions.flatMap(v => [v.name,v.label,v.catCode,v.constellation,v.objectType])
      .filter(Boolean).join(" ").toLowerCase().includes(q)));

  const D = i => num(i.distLy) ?? Infinity;
  const key = {
    ra:       i => i.hasSky ? i.ra_deg : 1e6,
    distance: i => D(i),
    fov:      i => i.fov_w_deg * i.fov_h_deg,
    hours:    i => i.hours || 0,
    date:     i => i.capturedAt ?? -Infinity,   // undated sort to one end
    likes:    i => i.favourites + i.downloads
  }[s];

  VIEW.sort((a,b) => s === "name"
    ? (a.name||a.label).localeCompare(b.name||b.label)
    : key(a) - key(b));
  if(!ASC) VIEW.reverse();

  const g = document.getElementById("grid");
  g.innerHTML = "";
  VIEW.forEach((im,ix) => {
    const f = document.createElement("figure");
    f.style.flex = `${im.ratio} 1 ${im.ratio*250}px`;
    f.tabIndex = 0;
    f.setAttribute("role","button");
    f.setAttribute("aria-label",`Open ${im.name || im.label}`);

    const img = document.createElement("img");
    img.src = im.thumbUrl; img.alt = im.name || im.label; img.loading = "lazy"; img.decoding = "async";

    const cap  = document.createElement("figcaption");
    const nm   = document.createElement("div"); nm.className = "cap-name"; nm.textContent = im.name || im.label;
    const meta = document.createElement("div"); meta.className = "cap-meta";
    const shortCon = im.constellation ? im.constellation.split(" (")[0] : null;
    const d = fmtDist(im.distLy);
    const bits = [shortCon, d ? d.replace(" light-years"," ly").replace(" light-minutes"," lt-min") : null]
                 .filter(Boolean).join("  ·  ");
    meta.append(document.createTextNode(bits));
    const nv = im.versions.length, vid = im.versions.some(v => v.videoUrl);
    if(nv > 1 || vid){
      const k = document.createElement("span");
      k.className = "vers";
      k.textContent = [nv > 1 ? nv + " versions" : null, vid ? "\u25b6 video" : null].filter(Boolean).join(" \u00b7 ");
      meta.appendChild(k);
    }
    const score = im.favourites + im.downloads;
    if(score){
      const k = document.createElement("span");
      k.className = "likes"; k.textContent = "\u2665 " + score;
      meta.appendChild(k);
    }
    cap.append(nm, meta);

    f.append(img, cap);
    const badge = siteBadge(im.site);
    if(badge) f.appendChild(badge);
    f.onclick   = () => open(ix);
    f.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(ix); } };
    g.appendChild(f);
  });

  if(!VIEW.length) g.innerHTML = '<p style="color:var(--dim);padding:40px">Nothing matches that search.</p>';
}

/* ==========================================================================
   LIGHTBOX
   ========================================================================== */
const lb = document.getElementById("lb");
let moonOn = false;

/* Everything the strip offers for one target: each version's photo, and its
   video straight after it when there is one. */
function itemsOf(t){
  return t.versions.flatMap(v => v.videoUrl ? [{v, video:false}, {v, video:true}] : [{v, video:false}]);
}

function open(ix, it = 0){
  CUR = ix;
  ITEMS = itemsOf(VIEW[ix]);
  show(Math.max(0, Math.min(it, ITEMS.length - 1)));

  // warm the neighbours so stepping left and right is instant
  [1,-1].forEach(d => {
    const n = VIEW[(ix + d + VIEW.length) % VIEW.length];
    if(n) new Image().src = n.fullUrl;
  });

  lb.classList.add("on");
  document.body.style.overflow = "hidden";
  document.getElementById("close").focus({preventScroll:true});
}

function strip(){
  const box = document.getElementById("vers");
  box.innerHTML = "";
  if(ITEMS.length < 2) return;
  ITEMS.forEach((x, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = i === IT ? "on" : "";
    const yr = (x.v.captured || "").slice(0,4);
    const what = x.video ? "\u25b6 video" : [yr, x.v.scope].filter(Boolean).join(" \u00b7 ");
    b.title = x.video ? "Play the video" : (what || "Version " + (i + 1));
    b.setAttribute("aria-label", b.title);
    b.setAttribute("aria-pressed", i === IT);
    const img = document.createElement("img");
    img.src = x.video ? (x.v.posterUrl || x.v.thumbUrl) : x.v.thumbUrl;
    img.alt = ""; img.loading = "lazy";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = what;
    b.append(img);
    if(x.video){ const pl = document.createElement("span"); pl.className = "play"; pl.textContent = "\u25b6"; b.append(pl); }
    b.append(tag);
    b.onclick = e => { e.stopPropagation(); show(i); };
    box.appendChild(b);
  });
}

function show(it){
  IT = it;
  const t = VIEW[CUR], {v:im, video} = ITEMS[it];

  document.getElementById("lbimg").src = im.fullUrl;
  document.getElementById("lbimg").alt = t.name || t.label;
  document.getElementById("lbname").textContent = t.name || t.label;
  const sitebox = document.getElementById("sitebadge");
  sitebox.innerHTML = "";
  const detailBadge = siteBadge(im.site);
  if(detailBadge) sitebox.appendChild(detailBadge);
  document.getElementById("codes").textContent =
    [im.catCode, im.objectType, im.constellation].filter(Boolean).join("  ·  ");

  const b = document.getElementById("blurb");
  b.textContent = im.blurb || "A description of this object is still to be written.";
  b.classList.toggle("placeholder", !im.blurb);

  // Constellation, Discovered and Telescope open a picture popup when
  // assets.json has one for them (see popFor below).
  const pa = popFor(im);
  const rows = [
    ["Distance",    fmtDist(im.distLy)],
    ["Constellation", pa.conText,  "con"],
    ["Discovered",  pa.whoText,    "who"],
    ["Framing",     im.hasSky ? `${fmtDeg(im.fov_w_deg)} × ${fmtDeg(im.fov_h_deg)}` : null],
    ["Telescope",   showScope(im.scope), "scope"],
    ["Camera",      showCamera(im.camera)],
    ["Filters",     showFilter(im.filters)],
    ["From",        im.location ? im.location + (im.bortle ? ` (Bortle ${im.bortle})` : "") : null],
    ["Exposure",    im.hours ? `${im.hours} hours over ${im.nights || "?"} nights` : null],
    ["Captured",    im.captured]
  ].filter(r => r[1]);

  document.getElementById("facts").innerHTML =
    rows.map(([k,v,kind]) => `<dt>${k}</dt><dd>` +
      (kind && pa[kind] ? `<button type="button" class="pl" data-pop="${kind}" aria-controls="acard">${esc(v)}</button>` : esc(v)) +
      `</dd>`).join("");
  document.querySelectorAll("#facts .pl").forEach(b => b.onclick = () => openCard(pa[b.dataset.pop]));
  hideAsset();             // a new photo starts without a card
  stopNarration();

  const stat = (ic,n,label,tip,href) => !n ? "" :
    `<${href?"a":"span"} class="stat"${href?` href="${href}" target="_blank" rel="noopener"`:""} title="${tip}">`+
    `<span class="ic">${ic}</span>${n}<span class="lb">${label}</span></${href?"a":"span"}>`;

  document.getElementById("reach").innerHTML =
    stat("\u2665", im.favourites, "favourites",
         "Favourited on AstroBin, Telescopius and AstrophotoMarket") +
    stat("\u21e3", im.downloads, "downloads",
         "People who have taken this dataset to process themselves. The raw files are free \u2014 click to grab them.",
         im.fits || "https://astrophotomarket.com/en/author/wade-tubman") +
    stat("\u21bb", im.reprocessed, "community edits",
         "Other astrophotographers who have published their own processing of this data",
         im.showcase);

  const links = [
    ["AstroBin",    im.astrobin],
    ["Telescopius", im.telescopius]
  ].filter(l => l[1]);

  const AUTHOR = "https://astrophotomarket.com/en/author/wade-tubman";
  const menu = [
    [im.fits || AUTHOR, "The raw data",
     im.fits ? "Calibrated FITS frames, free on AstrophotoMarket"
             : "Browse my free datasets on AstrophotoMarket"],
    [im.wallpaper || im.fullUrl, "Wallpaper", "3840 \u00d7 2160 JPEG for your desktop"]
  ].filter(m => m[0]);

  const canHear = !video && !!narrationFor(im);
  const where = im.hasSky ? SKYDOME + "?target=" + im.slug : null;
  const listen = `<span id="listen">` +
    (where ? `<a href="${where}" target="_blank" rel="noopener">See where it is<span class="ext">&#8599;</span></a>` : "") +
    `<button type="button" id="thear" aria-pressed="false"` + (canHear ? "" : " hidden") + `>Hear about it</button>` +
    `</span>`;
  document.getElementById("acts").innerHTML =
    `<span id="grab"><button type="button" id="grabbtn">Download &#9662;</button>` +
    `<div id="grabmenu">` + menu.map(([u,t,s]) =>
      `<a href="${u}" target="_blank" rel="noopener" ${u===im.fullUrl?'download':''}>${t}<span class="sub">${s}</span></a>`
    ).join("") + `</div></span>` +
    links.map(([t,u]) => `<a href="${u}" target="_blank" rel="noopener">${t}<span class="ext">&#8599;</span></a>`).join("") +
    listen;
  document.getElementById("tvoice").hidden = !canHear;
  const hearBtn = document.getElementById("thear");
  hearBtn.onclick = e => {
    e.stopPropagation();
    NAR.playing ? stopNarration() : startNarration();
  };

  const gb = document.getElementById("grabbtn"), gm = document.getElementById("grabmenu");
  gb.onclick = e => { e.stopPropagation(); gm.classList.toggle("on"); };
  document.addEventListener("click", () => gm.classList.remove("on"), {once:true});

  // no sky coordinates means no dome position and nothing to scale the Moon against
  const dome = document.getElementById("tdome"), moonBtn = document.getElementById("tmoon");
  dome.href = SKYDOME + "?target=" + im.slug;
  dome.style.display    = im.hasSky ? "" : "none";
  moonBtn.style.display = im.hasSky ? "" : "none";
  if(!im.hasSky && moonOn){
    moonOn = false;
    document.getElementById("moonlayer").classList.remove("on");
    moonBtn.classList.remove("on");
  }

  // a video has no plate scale on screen to hang the Moon on
  const vid = document.getElementById("lbvid");
  lb.classList.toggle("video", video);
  if(video){
    moonBtn.style.display = "none";
    vid.poster = im.posterUrl || im.fullUrl;
    if(vid.getAttribute("src") !== im.videoUrl){ vid.setAttribute("src", im.videoUrl); vid.load(); }
    const go = vid.play(); if(go && go.catch) go.catch(() => {});
  }else stopVideo();
  const moonNow = moonOn && !video;

  // the Moon stays on as you step through targets, and rescales each time
  document.getElementById("moonlayer").classList.toggle("on", moonNow);
  document.getElementById("tmoon").classList.toggle("on", moonOn);
  resetZoom();
  const shownEl = document.getElementById("lbimg");
  shownEl.onload = () => { if(moonOn && !lb.classList.contains("video")) drawMoon(); };
  if(moonNow && shownEl.naturalWidth) drawMoon();

  strip();
  history.replaceState(null,"","#" + im.slug);
}

function stopVideo(){
  const vid = document.getElementById("lbvid");
  if(!vid.getAttribute("src")) return;
  vid.pause(); vid.removeAttribute("src"); vid.load();     // stop the download too
}

/* ---- zoom & pan -------------------------------------------------------
   One transform on a wrapper. Zooming keeps the point under the cursor
   fixed, which is what makes it feel like a photo viewer rather than a
   scaling animation. */
let Z = 1, PX = 0, PY = 0, drag = null;
const vp  = document.getElementById("viewport");
const pan = document.getElementById("pan");

function applyZoom(live){
  pan.classList.toggle("live", !!live);
  pan.style.transform = `translate(${PX}px,${PY}px) scale(${Z})`;
  vp.classList.toggle("zoomed", Z > 1);
  document.getElementById("zoomhint").style.opacity = Z > 1 ? 0 : "";
}
function resetZoom(){ Z = 1; PX = PY = 0; applyZoom(); }
addEventListener("fullscreenchange", () => {
  document.getElementById("tfull").classList.toggle("on", !!document.fullscreenElement);
  if(moonOn) requestAnimationFrame(drawMoon);
});

function zoomAt(cx, cy, next){
  next = Math.min(6, Math.max(1, next));
  const r = vp.getBoundingClientRect();
  const x = cx - r.left, y = cy - r.top;
  // keep (x,y) over the same pixel of the image
  PX = x - (x - PX) * (next / Z);
  PY = y - (y - PY) * (next / Z);
  Z = next;
  if(Z === 1){ PX = PY = 0; }
  applyZoom(true);
}

vp.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Z * (e.deltaY < 0 ? 1.16 : 1/1.16));
}, {passive:false});

/* Every pointerdown starts a potential drag, whatever the zoom level — the old
   version only armed it above 1x, which is why panning did nothing. A gesture
   that finishes within a few pixels is treated as a click instead. */
vp.addEventListener("dragstart", e => e.preventDefault());

/* Track every active pointer so two fingers can pinch. One pointer pans,
   two pinch about their midpoint, and a press that never moves is a tap. */
const pointers = new Map();
let pinch = null;

vp.addEventListener("pointerdown", e => {
  e.preventDefault();                       // stop the native image drag
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try{ vp.setPointerCapture(e.pointerId); }catch(err){}

  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, z: Z};
    drag = null;
  }else if(pointers.size === 1){
    drag = {x:e.clientX, y:e.clientY, px:PX, py:PY, moved:false};
  }
});

vp.addEventListener("pointermove", e => {
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()];
    zoomAt((a.x+b.x)/2, (a.y+b.y)/2, pinch.z * (Math.hypot(a.x-b.x, a.y-b.y) / pinch.d));
    return;
  }
  if(!drag) return;
  drag.lx = e.clientX; drag.ly = e.clientY;
  if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6) drag.moved = true;
  if(Z <= 1 || !drag.moved) return;
  vp.classList.add("dragging");
  PX = drag.px + (e.clientX - drag.x);
  PY = drag.py + (e.clientY - drag.y);
  applyZoom(true);
});

function release(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  if(pointers.size) return;
  if(drag && !drag.moved) Z > 1 ? resetZoom() : toggleSolo();
  else if(drag && Z <= 1 && e.type === "pointerup"){
    // a horizontal flick on the un-zoomed photo pages to the next or previous target
    const dx = (drag.lx ?? drag.x) - drag.x, dy = (drag.ly ?? drag.y) - drag.y;
    if(Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
  }
  drag = null;
  vp.classList.remove("dragging");
}
vp.addEventListener("pointerup", release);
vp.addEventListener("pointercancel", release);

function fmtDeg(d){

function esc(s){

function toggleMoon(){

/* object-fit:contain letterboxes the photo inside the element, so the
   drawn width is not the element width — work out the real one first. */
function drawMoon(){
  const im    = ITEMS[IT] && ITEMS[IT].v;
  if(!im || !im.hasSky) return;
  const shown = document.getElementById("lbimg");
  const layer = document.getElementById("moonlayer");
  if(!im || !shown.naturalWidth) return;

  const boxW = shown.clientWidth, boxH = shown.clientHeight;
  const drawnW = Math.min(boxW, boxH * (shown.naturalWidth / shown.naturalHeight));

  layer.style.width = Math.max(drawnW * (MOON_DEG / im.fov_w_deg), 3) + "px";
}

function shut(){
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});

/* ==========================================================================
   INFO POPUPS — discoverer portrait, IAU constellation chart, telescope photo.
   Everything comes from assets.json and is hosted in this repo (assets/).
   ========================================================================== */
// One card each for a constellation, a person and a telescope. `L` is the
// image's entry in assets.json "labels" (year, caption, "that day" note).
function conCard(name, L = {}){
  const con = ((ASSETS || {}).constellations || {})[name];
  if(!con) return null;
  const day = L.constellation === name && L.constellation_text
    ? " \u00b7 " + L.constellation_text.replace(/^\S+\s*/, "").replace(/[()]/g, "") : "";
  return {kind:"con", title:name, file:con.file, chart:true, sub:"IAU constellation chart" + day,
          credit:con.credit, source:con.source, wiki:con.wiki};
}
function personCard(name, L = {}){
  const A = ASSETS || {}, p = (A.people || {})[name], fb = A.fallback || {};
  if(!p) return null;
  const mine = L.person === name;
  return {kind:"who", title:p.name,
    sub:mine ? (L.caption || (L.year ? `Discovered ${L.year}` : "")) : "",
    file:p.file || fb.file, fallback:!p.file,
    credit:p.file ? p.credit : "No portrait is hosted here yet." + (fb.credit ? " Placeholder: " + fb.credit + "." : ""),
    source:p.file ? p.source : (p.portrait_elsewhere || null), wiki:p.wiki};
}
function scopeCard(key, site){
  const A = ASSETS || {}, s = (((A.site_scopes || {})[site]) || {})[key] || (A.scopes || {})[key];
  return s ? {kind:"scope", title:s.title, sub:s.caption, file:s.file, credit:s.credit} : null;
}
function popFor(im){
  const L = ((ASSETS || {}).labels || {})[im.label] || {};
  const out = {};
  out.conText = im.constellation || L.constellation_text || L.constellation || null;
  if(out.conText) out.con = conCard(L.constellation, L);
  out.whoText = im.foundBy || (L.show_person === false ? null : L.discovered_text) || null;
  if(out.whoText) out.who = personCard(L.person, L);
  out.scope = scopeCard(im.scope, im.site);
  return out;
}

/* The docked card: small, non-modal, bottom-right of the photo. The photo,
   arrows and details panel stay usable underneath and around it. */
const acard = document.getElementById("acard");
function openCard(d){
  if(!d) return false;
  const fig = document.getElementById("acfig"), img = document.getElementById("acimg");
  fig.hidden = !d.file; fig.classList.toggle("chart", !!d.chart);
  img.onerror = null;
  if(d.file){
    img.src = d.file; img.alt = d.title;
    const fb = ASSETS && ASSETS.fallback && ASSETS.fallback.file;
    img.onerror = () => { if(fb && !img.src.endsWith(fb)){ img.onerror = null; img.src = fb; } };
  }else img.removeAttribute("src");
  document.getElementById("actitle").textContent = d.title;
  document.getElementById("acsub").textContent = d.sub || "";
  const ln = [d.source && `<a href="${esc(d.source)}" target="_blank" rel="noopener">source</a>`,
              d.wiki && `<a href="${esc(d.wiki)}" target="_blank" rel="noopener">Wikipedia</a>`].filter(Boolean);
  document.getElementById("accredit").innerHTML =
    [d.credit ? esc(d.credit) : "", ln.join(" \u00b7 ")].filter(Boolean).join(" \u00b7 ");
  acard.dataset.kind = d.kind;
  acard.classList.add("on");
  return true;
}
function hideAsset(){ acard.classList.remove("on"); }
document.getElementById("acx").onclick = hideAsset;

/* For automation (the narration cues show_constellation, show_discoverer_image,
   show_scope):  showAsset(kind, key)  /  hideAsset().
   kind: "constellation" | "discoverer" | "scope" (or "con", "who", "person").
   key:  a name ("Sculptor", "James Dunlop", "200PDS"), a longer narration
         string that contains one ("61 mm refractor (RedCat 61)"), or omitted
         to use the image on show. Returns true if a card opened. */
function showAsset(kind, key){
  const A = ASSETS || {}, im = ITEMS[IT] && ITEMS[IT].v;
  const L = im ? ((A.labels || {})[im.label] || {}) : {};
  const k = String(kind || "").toLowerCase();
  const find = (obj, nameOf) => {
    if(key == null) return null;
    const q = String(key).toLowerCase();
    const keys = Object.keys(obj || {});
    return keys.find(n => n.toLowerCase() === q)
        || keys.find(n => nameOf(n).some(a => a && a.toLowerCase() === q))
        || keys.find(n => nameOf(n).some(a => a && q.includes(a.toLowerCase())))
        || null;
  };
  if(/^con/.test(k)){
    const n = key == null ? L.constellation : find(A.constellations, n => [n]);
    return openCard(conCard(n, L));
  }
  if(/^(who|person|disc)/.test(k)){
    const n = key == null ? L.person : find(A.people, n => [n, A.people[n].name, ...(A.people[n].aliases || [])]);
    return openCard(personCard(n, L));
  }
  if(/^scope|^tel/.test(k)){
    const n = key == null ? (im && im.scope) : find(A.scopes, n => [n, A.scopes[n].title, ...(A.scopes[n].aliases || [])]);
    return openCard(scopeCard(n, im && im.scope === n ? im.site : null));
  }
  return false;
}
window.showAsset = showAsset;
window.hideAsset = hideAsset;

/* ==========================================================================
   NARRATION (v0.26) — plays an image's parts in order and drives the docked
   card and the Moon overlay. Data: assets.json labels[label].narration =
     {parts:[{file, show:"constellation"|"discoverer"|"moon"|"scope"|null, hold_s?}]}
   Five parts: intro, discoverer, science (Moon for hold_s), scope, closing
   (show null, photo clear). The speaker icon and "Hear about it" start and
   stop the same sequence. Starts only from a tap (iOS needs that), skips a
   part whose file fails, preloads the next part, and clears at the end.
   ========================================================================== */
const NAR = {audio:null, next:null, parts:[], i:-1, shown:-1, timer:null, moonMine:false, playing:false};
function narrationFor(im){
  const n = im && (((ASSETS || {}).labels || {})[im.label] || {}).narration;
  return n && Array.isArray(n.parts) && n.parts.length ? n : null;
}
function narEvent(type, detail = {}){
  window.dispatchEvent(new CustomEvent("narration", {detail:{type, part:NAR.i, t:Date.now(), ...detail}}));
}
function narMoon(on){
  if(on && !moonOn){ toggleMoon(); NAR.moonMine = true; }
  else if(!on && NAR.moonMine){ if(moonOn) toggleMoon(); NAR.moonMine = false; }
}
function narClearOverlays(){
  clearTimeout(NAR.timer); NAR.timer = null;
  hideAsset(); narMoon(false);
}
function narShow(part){
  narClearOverlays();
  const what = part.show || null;
  if(what === "moon") narMoon(true);
  else if(what) showAsset(what);
  narEvent("show", {show:what});
  if(what && part.hold_s > 0) NAR.timer = setTimeout(() => {
    narClearOverlays(); narEvent("hide", {show:what});
  }, part.hold_s * 1000);
}
function narPlay(i){
  if(!NAR.playing) return;
  if(i >= NAR.parts.length){ narEvent("end"); stopNarration(); return; }
  NAR.i = i; NAR.shown = -1;
  const part = NAR.parts[i], a = NAR.audio;
  a.src = part.file;
  narEvent("part", {file:part.file, show:part.show || null});
  const go = a.play();
  if(go && go.catch) go.catch(err => {
    if(!NAR.playing || NAR.i !== i) return;
    if(err && err.name === "NotAllowedError"){ stopNarration(); narEvent("blocked"); }
    else narSkip(i, "play failed");
  });
  // warm the cache for the next part
  const nx = NAR.parts[i + 1];
  if(nx){ NAR.next.src = nx.file; NAR.next.load(); }
}
function narSkip(i, why){
  if(!NAR.playing || NAR.i !== i) return;
  narEvent("skip", {why});
  narPlay(i + 1);
}
function setNarrationPlaying(on){
  const voice = document.getElementById("tvoice");
  const hear = document.getElementById("thear");
  if(voice){
    voice.classList.toggle("playing", on);
    voice.setAttribute("aria-pressed", on ? "true" : "false");
    voice.title = on ? "Stop the narration" : "Play the narration";
    voice.setAttribute("aria-label", voice.title);
  }
  if(hear){
    hear.classList.toggle("playing", on);
    hear.setAttribute("aria-pressed", on ? "true" : "false");
    hear.textContent = on ? "Stop narration" : "Hear about it";
    hear.setAttribute("aria-label", hear.textContent);
  }
}
function startNarration(){
  const im = ITEMS[IT] && ITEMS[IT].v, n = narrationFor(im);
  if(!n) return;
  if(!NAR.audio){
    // one element for the whole sequence: unlocked by this tap, reused for every part
    NAR.audio = new Audio(); NAR.audio.preload = "auto"; NAR.audio.setAttribute("playsinline", "");
    NAR.next = new Audio(); NAR.next.preload = "auto"; NAR.next.muted = true;
    // "playing" fires again after a stall, so each part's overlay is set only once
    NAR.audio.addEventListener("playing", () => { if(NAR.playing && NAR.shown !== NAR.i){ NAR.shown = NAR.i; narShow(NAR.parts[NAR.i]); } });
    NAR.audio.addEventListener("ended",   () => { if(NAR.playing) narPlay(NAR.i + 1); });
    NAR.audio.addEventListener("error",   () => { if(NAR.playing && NAR.audio.getAttribute("src")) narSkip(NAR.i, "load error"); });
  }
  NAR.parts = n.parts; NAR.playing = true;
  setNarrationPlaying(true);
  narEvent("start", {label:im.label});
  narPlay(0);
}
function stopNarration(){
  if(!NAR.playing && NAR.i < 0) return;
  const was = NAR.playing;
  NAR.playing = false; NAR.i = -1;
  if(NAR.audio){ NAR.audio.pause(); NAR.audio.removeAttribute("src"); NAR.audio.load(); }
  if(NAR.next){ NAR.next.removeAttribute("src"); }
  narClearOverlays();
  setNarrationPlaying(false);
  if(was) narEvent("stop");
}
document.getElementById("tvoice").onclick = e => {
  e.stopPropagation();
  NAR.playing ? stopNarration() : startNarration();
};
window.narration = {play:startNarration, stop:stopNarration, state:() => ({playing:NAR.playing, part:NAR.i})};

/* ==========================================================================
   THEME — follow the operating system first, remember a manual choice after
   ========================================================================== */
const btnTheme = document.getElementById("theme");
function setTheme(t){
  document.documentElement.dataset.theme = t;
  btnTheme.textContent = t === "light" ? "Dark" : "Light";
  btnTheme.setAttribute("aria-label", `Switch to ${t === "light" ? "dark" : "light"} theme`);
}
// Dark unless the visitor has explicitly asked for light — photographs read
// badly on a pale background, so the OS preference does not get a vote here.
setTheme(localStorage.getItem("theme") || "dark");
btnTheme.onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("theme", t);
  setTheme(t);
};

document.getElementById("q").oninput     = render;
const DESC_FIRST = new Set(["likes", "date"]);   // newest and most popular first
document.getElementById("sort").onchange = e => {
  ASC = !DESC_FIRST.has(e.target.value);
  document.getElementById("dir").textContent = ASC ? "\u2191" : "\u2193";
  render();
};

document.getElementById("seek").onclick = () => {
  const box = document.getElementById("q");
  box.classList.toggle("open");
  if(box.classList.contains("open")) box.focus();
  else { box.value = ""; render(); }
};
document.getElementById("dir").onclick = e => {
  ASC = !ASC;
  e.currentTarget.textContent = ASC ? "\u2191" : "\u2193";
  render();
};
boot();
</script>
</body>
</html>
